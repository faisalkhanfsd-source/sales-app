<!doctype html><html lang="ur" dir="rtl"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1"><title>سیل رپورٹ</title>
<style>
body{font-family:"Noto Nastaliq Urdu","Segoe UI",Tahoma,sans-serif;background:#f3f5f9;margin:0;color:#1d2433}
.box{max-width:min(960px,94vw);margin:8vh auto;background:#fff;padding:28px;border-radius:14px;box-shadow:0 4px 20px #0001}
h1{font-size:1.3rem;margin:0 0 18px}label{display:block;margin:14px 0 6px;font-weight:600}
input[type=text],input[type=password],input[type=file]{width:100%;box-sizing:border-box;padding:10px;border:1px solid #c9d0de;border-radius:8px;background:#fafbfd}
button{margin-top:20px;width:100%;padding:12px;border:0;border-radius:8px;background:#1a56db;color:#fff;font-size:1rem;cursor:pointer}
button:disabled{opacity:.6}.err{background:#fde8e8;color:#9b1c1c;padding:10px;border-radius:8px;margin-bottom:10px}
.top{text-align:left;font-size:.85rem}a{color:#1a56db}
</style></head><body><div class="box">{% with m=get_flashed_messages() %}{% for x in m %}<div class="err">{{x}}</div>{% endfor %}{% endwith %}
{% block c %}{% endblock %}</div></body></html>
